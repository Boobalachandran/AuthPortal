spring.application.name=AuthPortal

# PostgreSQL DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authportal}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Cloud SQL Java Connector (commented for local dev, uncomment for Cloud SQL)
#spring.datasource.hikari.data-source-properties.socketFactory=com.google.cloud.sql.postgres.SocketFactory
#spring.datasource.hikari.data-source-properties.cloudSqlInstance=${CLOUD_SQL_INSTANCE:}
#spring.datasource.hikari.data-source-properties.cloudSqlRefreshStrategy=lazy

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=authportal-user-signup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.sportsapp.kafka.event.UserSignedUpEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.sportsapp.kafka.event

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.from=${MAIL_FROM_ADDRESS}

spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.auth=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:300000}

# CORS Configuration (externalizable, required for multi-environment deployments)
# Format: comma-separated list of allowed origins (e.g., http://localhost:3000,https://app.example.com)
# Each origin must be a valid HTTP/HTTPS URL with scheme, host, and optional port
# Validation occurs at startup; missing or invalid origins will cause application failure (fail-fast)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OAuth2 Frontend Redirect Base URL (externalizable)
# After successful OAuth2 login, browser is redirected to this URL with JWT in query parameters
# Must match a CORS-allowed origin for browser to receive the response
# Example: http://localhost:3000 (local dev) or https://app.example.com (production)
app.oauth.frontend-redirect-base-url=${APP_OAUTH_FRONTEND_REDIRECT_BASE_URL:http://localhost:3000}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Actuator Endpoints (Prometheus metrics and health checks)
management.endpoints.web.exposure.include=health,info,prometheus,metrics

