# ───────────────────────────────────────────────────────────────────────────────
# AuthPortal Test Configuration
# ───────────────────────────────────────────────────────────────────────────────
# This configuration is used only during test execution (@SpringBootTest).
# It uses an embedded H2 database instead of PostgreSQL to make tests independent
# of external infrastructure dependencies.
#
# Production configuration remains unchanged in application.properties.
# ───────────────────────────────────────────────────────────────────────────────

# ─── H2 Embedded Database (Test Only) ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console for debugging (disabled by default, enable only for troubleshooting)
spring.h2.console.enabled=false

# ─── JPA / Hibernate Configuration ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ─── Redis Configuration (Test Defaults) ──────────────────────────────────────
# Using default localhost configuration for tests
# Tests should either mock Redis or skip Redis-dependent tests
spring.data.redis.host=localhost
spring.data.redis.port=0

# ─── Kafka Configuration (Test Defaults) ──────────────────────────────────────
# Using default bootstrap servers for tests
# Tests should either mock Kafka or skip Kafka-dependent tests
spring.kafka.bootstrap-servers=localhost:9094

# ─── Mail Configuration (Test Defaults) ────────────────────────────────────────
# Using dummy values for tests
MAIL_FROM_ADDRESS=test@example.com
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.from=test@example.com
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.auth=false

# ─── JWT Configuration (Test Defaults) ─────────────────────────────────────────
jwt.secret=test-secret-key-for-testing-only-not-for-production-use-12345678
jwt.expiration=300000

# ─── OAuth2 Configuration (Test Defaults) ──────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ─── CORS Configuration (Test Defaults) ────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000
app.oauth.frontend-redirect-base-url=http://localhost:3000

# ─── SQL Logging (Disabled for Tests) ──────────────────────────────────────────
SHOW_SQL=false

# ─── Actuator Configuration ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics




