services:

  postgres:
    image: postgres:17
    container_name: personal-postgres
    environment:
      POSTGRES_DB: authportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - personal-postgres-data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: authportal-auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authportal
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 300000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}"
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 465
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      # ─── New configuration (patch) ────────────────────────────────────────────
      # CORS allowed origins: comma-separated browser origins that can make requests
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      # OAuth2 frontend redirect destination (after login, browser receives this URL with JWT)
      APP_OAUTH_FRONTEND_REDIRECT_BASE_URL: "${APP_OAUTH_FRONTEND_REDIRECT_BASE_URL:-http://localhost:3000}"
      # SQL logging for debugging (disabled by default; enable only during development)
      SHOW_SQL: "${SHOW_SQL:-false}"
      # ──────────────────────────────────────────────────────────────────────────
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  notification-service:
    build: ./notification-service
    container_name: authportal-notification-service
    environment:
      # Kafka internal listener (containers communicate via kafka:9092)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 465
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      - kafka

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: authportal-gateway
    environment:
      GATEWAY_BACKEND_URI: http://auth-service:8080
    ports:
      - "8081:8081"
    depends_on:
      - auth-service

  frontend:
    build: ./frontend
    container_name: authportal-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - auth-service

  redis:
    image: redis:7-alpine
    container_name: authportal-redis
    ports:
      - "6379:6379"


  kafka:
    image: apache/kafka:4.0.0
    container_name: authportal-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  prometheus:
    image: prom/prometheus:latest
    container_name: authportal-prometheus
    ports:
       - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - auth-service

  grafana:
    image: grafana/grafana:latest
    container_name: authportal-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  personal-postgres-data:

