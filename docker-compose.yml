services:

  postgres:
    image: postgres:17
    container_name: personal-postgres
    environment:
      POSTGRES_DB: authportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_DB_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - personal-postgres-data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: authportal-auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5433/authportal
      DB_USERNAME: postgres
      DB_PASSWORD: REDACTED_DB_PASSWORD
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  notification-service:
    build: ./notification-service
    container_name: authportal-notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 465
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      - kafka

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: authportal-gateway
    environment:
      GATEWAY_BACKEND_URI: http://auth-service:8080
    ports:
      - "8081:8081"
    depends_on:
      - auth-service

  frontend:
    build: ./frontend
    container_name: authportal-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - auth-service

  redis:
    image: redis:7-alpine
    container_name: authportal-redis
    ports:
      - "6379:6379"


  kafka:
    image: apache/kafka:4.0.0
    container_name: authportal-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"



volumes:
  personal-postgres-data:

