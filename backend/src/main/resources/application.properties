spring.application.name=AuthPortal
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.auth=true

jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtTokenGenerationThatIsLongEnough123456}
jwt.expiration=${JWT_EXPIRATION:86400000}


spring.security.oauth2.client.registration.google.client-id=888408215382-4nl3f189jefa0jnmpr23t79r7tf3brnn.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=REDACTED_OAUTH_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
