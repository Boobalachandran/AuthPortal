spring.application.name=gateway
server.port=8081

gateway.backend-uri=${GATEWAY_BACKEND_URI:http://localhost:8080}

spring.cloud.gateway.server.webmvc.routes[0].id=authportal-backend
spring.cloud.gateway.server.webmvc.routes[0].uri=${gateway.backend-uri}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=authportal-backend-oauth2
spring.cloud.gateway.server.webmvc.routes[1].uri=${gateway.backend-uri}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/oauth2/**

spring.cloud.gateway.server.webmvc.routes[2].id=authportal-oauth-callback
spring.cloud.gateway.server.webmvc.routes[2].uri=${gateway.backend-uri}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/login/oauth2/code/**
